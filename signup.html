<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <title>Log in</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./src/output.css" rel="stylesheet" />
  </head>
  <body
    class="bg-linear-to-r from-indigo-900 to-blue-700 flex justify-center font-iranyekan"
  >
    <main
      class="bg-white p-10 rounded-2xl w-120  m-30 hover:scale-110 duration-200 leading-10 outline-2 outline-blue-950 outline-offset-4"
    >
      <h1 class="inlineblo w-full text-center text-2xl font-bold">
        ورود به <span class="text-2xl font-bold fontmono bg-linear-to-r from-blue-500 to-blue-700 bg-clip-text text-transparent">جورکالا</span>
      </h1>
    
      <div>
        <form action="index.html">
          <input
            class="class=inlineblo w-full border-b-2 border-b-blue-500 mt-10 placeholder: focus:outline-none focus:scale-105 duration-150"
            placeholder="نام کاربری یا ایمیل را وارد کنید"
            type="text"
          />
          <input
            placeholder="رمز عبور را وارد کنید"
            class="inlineblo w-full border-b-2 border-b-blue-500 my-10 placeholder: focus:outline-none focus:scale-105 duration-150"
            type="password"
          /><button
            class="inlineblo w-full bg-blue-500 p-2 rounded-lg mb-5 border-2 border-white hover:font-bold hover:border-2 hover:border-blue-800"
            type="submit"
          >
            ورود به جورکالا
          </button>
          <a
            href="#"
            class="text-blue-500 justify-center flex text-sm hover:italic"
            >فراموشی رمز عبور</a
          ><a
            href="#"
            class="text-blue-500 justify-center flex text-sm hover:italic"
            >ایجاد حساب جورکالا</a
          >
        </form>
      </div>
    </main>
  </body>
</html>
